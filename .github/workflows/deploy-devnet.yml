name: Deploy to Devnet

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ''

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.30.1 anchor-cli --locked
        env:
          CARGO_PROFILE_RELEASE_LTO: thin

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-anchor-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup wallet
        run: |
          echo '${{ secrets.DEVNET_WALLET_KEY }}' > /tmp/deployer.json
          solana config set --url devnet
          solana config set --keypair /tmp/deployer.json
          echo "Wallet: $(solana-keygen pubkey /tmp/deployer.json)"
          solana balance

      - name: Build program
        run: anchor build

      - name: Upgrade program on devnet
        run: |
          PROGRAM_ID="CSBAc1SiMALr4rnuCoB17BsddzthB4RAhjibGvyt6p6S"
          echo "Upgrading program: $PROGRAM_ID"
          solana program deploy \
            target/deploy/trust_protocol.so \
            --program-id $PROGRAM_ID \
            --upgrade-authority /tmp/deployer.json \
            --url devnet
          echo "Program upgraded successfully!"

      - name: Verify deployment
        run: |
          PROGRAM_ID="CSBAc1SiMALr4rnuCoB17BsddzthB4RAhjibGvyt6p6S"
          solana program show $PROGRAM_ID --url devnet
          echo ""
          echo "Explorer: https://explorer.solana.com/address/$PROGRAM_ID?cluster=devnet"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/deployer.json
