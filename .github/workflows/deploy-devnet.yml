name: Deploy to Devnet

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ''

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana/install
          key: ${{ runner.os }}-solana-stable

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Rust 1.79.0 (for Anchor CLI compile)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.79.0

      - name: Cache Anchor CLI binary
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: ${{ runner.os }}-anchor-cli-v0.31.1

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          cargo +1.79.0 install --git https://github.com/coral-xyz/anchor --tag v0.31.1 anchor-cli --locked
        env:
          CARGO_PROFILE_RELEASE_LTO: thin

      - name: Install Rust stable (for anchor build)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-anchor-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup wallets
        run: |
          echo '${{ secrets.DEVNET_WALLET_KEY }}' > /tmp/deployer.json
          solana config set --url devnet
          solana config set --keypair /tmp/deployer.json
          DEPLOYER=$(solana-keygen pubkey /tmp/deployer.json)
          echo "Deployer: $DEPLOYER"
          solana balance
          echo "DEPLOYER_PUBKEY=$DEPLOYER" >> $GITHUB_ENV

          # Create fresh buffer-funder keypair (new address avoids rate limits)
          solana-keygen new --no-bip39-passphrase -o /tmp/funder.json --silent
          FUNDER=$(solana-keygen pubkey /tmp/funder.json)
          echo "Fresh buffer funder: $FUNDER"
          echo "FUNDER_PUBKEY=$FUNDER" >> $GITHUB_ENV

      - name: Fund buffer-funder keypair via airdrop
        run: |
          echo "Requesting 2 SOL airdrop to fresh funder (new address, no rate limit)..."
          solana airdrop 2 $FUNDER_PUBKEY --url devnet || echo "Airdrop failed"
          echo "Also trying airdrop to deployer..."
          solana airdrop 2 --url devnet || echo "Deployer airdrop failed (rate limited)"
          echo "Funder balance: $(solana balance $FUNDER_PUBKEY --url devnet)"
          echo "Deployer balance:"
          solana balance

      - name: Close orphaned buffer accounts
        run: |
          echo "Recovering SOL from any orphaned program buffers..."
          solana program close --buffers --url devnet || echo "No buffers to close"
          solana balance

      - name: Build program
        run: anchor build

      - name: Extend program data if binary grew
        run: |
          PROGRAM_ID="CSBAc1SiMALr4rnuCoB17BsddzthB4RAhjibGvyt6p6S"
          NEW_SIZE=$(wc -c < target/deploy/trust_protocol.so)
          echo "New binary size: $NEW_SIZE bytes"
          CURRENT_SIZE=$(solana program show $PROGRAM_ID --url devnet 2>&1 | grep -oP 'Data Length: \K[0-9]+' || echo "0")
          echo "Current program data size: ${CURRENT_SIZE:-0} bytes"
          if [ -z "$CURRENT_SIZE" ] || [ "$CURRENT_SIZE" = "0" ]; then
            echo "Could not determine current size, skipping extend"
          elif [ "$NEW_SIZE" -gt "$CURRENT_SIZE" ]; then
            EXTRA=$((NEW_SIZE - CURRENT_SIZE + 4096))
            echo "Binary grew. Extending program data by $EXTRA bytes..."
            solana program extend $PROGRAM_ID $EXTRA --url devnet
            echo "Deployer balance after extend:"
            solana balance
          else
            echo "No extension needed (new=$NEW_SIZE <= current=$CURRENT_SIZE)."
          fi

      - name: Write buffer using funder (avoids deployer SOL bottleneck)
        run: |
          FUNDER_BAL=$(solana balance $FUNDER_PUBKEY --url devnet | awk '{print $1}')
          echo "Funder balance: $FUNDER_BAL SOL"
          echo "Deployer balance:"
          solana balance

          if (( $(echo "$FUNDER_BAL > 1.0" | bc -l) )); then
            echo "Writing program buffer using funder as fee payer..."
            BUFFER_OUT=$(solana program write-buffer \
              target/deploy/trust_protocol.so \
              --fee-payer /tmp/funder.json \
              --url devnet 2>&1)
            echo "$BUFFER_OUT"
            BUFFER=$(echo "$BUFFER_OUT" | grep -oP 'Buffer: \K\S+')
            echo "Buffer address: $BUFFER"

            if [ -n "$BUFFER" ]; then
              echo "Transferring buffer authority to deployer..."
              solana program set-buffer-authority $BUFFER \
                --new-buffer-authority $DEPLOYER_PUBKEY \
                --keypair /tmp/funder.json \
                --url devnet
              echo "BUFFER_ADDR=$BUFFER" >> $GITHUB_ENV
              echo "USE_BUFFER=true" >> $GITHUB_ENV
            else
              echo "Could not extract buffer address, will fall back to direct deploy"
              echo "USE_BUFFER=false" >> $GITHUB_ENV
            fi
          else
            echo "Funder has insufficient SOL, falling back to direct deploy"
            echo "USE_BUFFER=false" >> $GITHUB_ENV
          fi

      - name: Upgrade program on devnet
        run: |
          PROGRAM_ID="CSBAc1SiMALr4rnuCoB17BsddzthB4RAhjibGvyt6p6S"
          if [ "$USE_BUFFER" = "true" ] && [ -n "$BUFFER_ADDR" ]; then
            echo "Upgrading from pre-written buffer: $BUFFER_ADDR"
            solana program upgrade $BUFFER_ADDR $PROGRAM_ID --url devnet
          else
            echo "Direct deploy (fallback path)..."
            solana program deploy \
              target/deploy/trust_protocol.so \
              --program-id $PROGRAM_ID \
              --upgrade-authority /tmp/deployer.json \
              --url devnet
          fi
          echo "Program upgraded successfully!"

      - name: Verify deployment
        run: |
          PROGRAM_ID="CSBAc1SiMALr4rnuCoB17BsddzthB4RAhjibGvyt6p6S"
          solana program show $PROGRAM_ID --url devnet
          echo ""
          echo "Explorer: https://explorer.solana.com/address/$PROGRAM_ID?cluster=devnet"

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/deployer.json /tmp/funder.json
          # Close any leftover buffers from funder
          solana program close --buffers --keypair /tmp/funder.json --url devnet 2>/dev/null || true
