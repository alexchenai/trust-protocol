name: Deploy to Devnet

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ''

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana/install
          key: ${{ runner.os }}-solana-stable

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Rust 1.79.0 (for Anchor CLI compile)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.79.0

      - name: Cache Anchor CLI binary
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: ${{ runner.os }}-anchor-cli-v0.31.1

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          cargo +1.79.0 install --git https://github.com/coral-xyz/anchor --tag v0.31.1 anchor-cli --locked
        env:
          CARGO_PROFILE_RELEASE_LTO: thin

      - name: Install Rust stable (for anchor build)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-anchor-build-${{ hashFiles('**/Cargo.lock') }}-v2

      - name: Setup wallet
        run: |
          echo '${{ secrets.DEVNET_WALLET_KEY }}' > /tmp/deployer.json
          solana config set --url devnet
          solana config set --keypair /tmp/deployer.json
          echo "Wallet: $(solana-keygen pubkey /tmp/deployer.json)"
          solana balance

      - name: Attempt devnet airdrop (best-effort)
        run: |
          echo "Attempting airdrop from multiple sources..."
          DEPLOYER=$(solana-keygen pubkey /tmp/deployer.json)
          # Standard RPC airdrop
          solana airdrop 2 --url devnet && echo "RPC airdrop succeeded" || echo "RPC airdrop failed"
          # Solana web faucet API
          curl -s -m 10 -X POST "https://faucet.solana.com/api/request_airdrop" \
            -H "Content-Type: application/json" \
            -d "{\"pubkey\":\"$DEPLOYER\",\"amount\":1}" 2>&1 | head -c 200 || true
          echo ""
          echo "Balance after airdrop attempts:"
          solana balance

      - name: Close orphaned buffer accounts
        run: |
          echo "Recovering SOL from any orphaned program buffers..."
          solana program close --buffers --url devnet || echo "No buffers to close"
          solana balance

      - name: Build program (opt-level=z for size reduction)
        run: anchor build

      - name: Check sizes and extend if needed
        run: |
          PROGRAM_ID="CSBAc1SiMALr4rnuCoB17BsddzthB4RAhjibGvyt6p6S"
          NEW_SIZE=$(wc -c < target/deploy/trust_protocol.so)
          echo "New binary size: $NEW_SIZE bytes"
          CURRENT_SIZE=$(solana program show $PROGRAM_ID --url devnet 2>&1 | grep -oP 'Data Length: \K[0-9]+' || echo "0")
          echo "Current program data size: ${CURRENT_SIZE:-0} bytes"
          DEPLOYER_BAL=$(solana balance | awk '{print $1}')
          echo "Deployer balance: $DEPLOYER_BAL SOL"

          if [ -z "$CURRENT_SIZE" ] || [ "$CURRENT_SIZE" = "0" ]; then
            echo "Could not determine current size, skipping extend"
          elif [ "$NEW_SIZE" -gt "$CURRENT_SIZE" ]; then
            EXTRA=$((NEW_SIZE - CURRENT_SIZE + 4096))
            echo "Binary grew. Extending program data by $EXTRA bytes..."
            solana program extend $PROGRAM_ID $EXTRA --url devnet
            echo "Deployer balance after extend:"
            solana balance
          else
            echo "No extension needed (new=$NEW_SIZE <= current=$CURRENT_SIZE)."
          fi

      - name: Deploy program
        run: |
          PROGRAM_ID="CSBAc1SiMALr4rnuCoB17BsddzthB4RAhjibGvyt6p6S"
          echo "Deploying program (binary size $(wc -c < target/deploy/trust_protocol.so) bytes)..."
          echo "Deployer balance: $(solana balance)"
          solana program deploy \
            target/deploy/trust_protocol.so \
            --program-id $PROGRAM_ID \
            --upgrade-authority /tmp/deployer.json \
            --url devnet
          echo "Program deployed successfully!"

      - name: Verify deployment
        run: |
          PROGRAM_ID="CSBAc1SiMALr4rnuCoB17BsddzthB4RAhjibGvyt6p6S"
          solana program show $PROGRAM_ID --url devnet
          echo ""
          echo "Explorer: https://explorer.solana.com/address/$PROGRAM_ID?cluster=devnet"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/deployer.json
